spring.application.name=jewel-erp
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:jewel_erp}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-hours=${JWT_EXPIRY_HOURS:12}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
app.seed-demo-data=${SEED_DEMO_DATA:true}
